name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true

      - name: Install analysis tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/arch-go/arch-go/v2@v2.1.2
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1

      # The same gate the pre-push hook runs: vet, analyzers, strict lint, race tests, layer rules, govulncheck,
      # and the proof that every rule fires on its fixture.
      - name: Verify
        run: go run ./tools/agentctl verify --full

      # Tests that need a real Postgres: the pool's timeouts and query budget, and each service's adapter. Required here,
      # so a missing sqlc or Docker fails the build instead of skipping the proof.
      - name: Database tests
        env:
          AGENTCTL_REQUIRE_DB: "1"
        run: |
          go run ./tools/agentctl db test
          cd tools && go test -race -count=1 -timeout 300s ./internal/dbcheck

      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          for sha in $(git rev-list "origin/${BASE_REF}..HEAD"); do
            git log -1 --format=%B "$sha" > "${RUNNER_TEMP}/msg"
            go run ./tools/agentctl commitmsg "${RUNNER_TEMP}/msg"
          done
